name: Build and deploy API to Azure Web App

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io/
          username: ${{ secrets.AzureAppService_ContainerUsername_7587ca3c072a497ebe1c91a258948794 }}
          password: ${{ secrets.AzureAppService_ContainerPassword_4074ec2ca75348fc9bcc17535638b5c5 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.AzureAppService_ContainerUsername_7587ca3c072a497ebe1c91a258948794 }}/speckai/speckai/speck-api:${{ github.sha }}
          file: ./apps/api/Dockerfile
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "speck-api"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_6199520629dc4a0c96bf44a1784b5980 }}
          images: "ghcr.io/${{ secrets.AzureAppService_ContainerUsername_7587ca3c072a497ebe1c91a258948794 }}/speckai/speckai/speck-api:${{ github.sha }}"
