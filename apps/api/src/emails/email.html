<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Your Speck Waitlist Subscription</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #ffffff !important;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #1e1e1e;
      }
      .container {
        background: radial-gradient(circle, rgb(12, 28, 75), rgba(2, 5, 10, 1));
        border-radius: 8px;
        padding: 30px;
        display: flex;
        align-items: center;
      }
      .content {
        flex: 1;
      }
      h1 {
        color: #ffffff !important;
        margin-bottom: 20px;
      }
      p {
        margin-bottom: 20px;
        color: #ffffff !important;
      }
      a {
        color: #ffffff !important;
        text-decoration: none;
      }
      .btn {
        display: inline-block;
        background-color: #1976d2;
        color: white !important;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-weight: bold;
      }
      .btn:hover {
        background-color: #1565c0;
        color: white !important;
      }
      .image {
        margin-left: 20px;
      }
      img {
        max-width: 100px;
        border-radius: 50%;
      }
      .footer {
        margin-top: 20px;
        font-size: 0.9em;
        color: #808080;
      }
      .footer p {
        color: #808080;
      }
      .speck-icon {
        width: 17px;
        height: 17px;
        margin-right: 10px;
        padding: 3px;
        vertical-align: middle;
        position: relative;
        top: -2px;
        background-color: #003152;
        border-radius: 50%;
      }
      .discord-icon {
        width: 20px;
        height: 20px;
        margin-right: 10px;
        vertical-align: middle;
        position: relative;
        top: -2px;
      }
      .discord-card {
        border: 2px solid #7289da;
        color: white !important;
        border-radius: 5px;
        padding: 5px 10px 5px 10px;
        display: inline-block;
        text-decoration: none;
        text-align: center;
      }
      .discord-card:hover {
        background-color: #7289da;
        color: white !important;
        text-decoration: none;
      }
      .discord-card i {
        margin-right: 10px;
      }
      .footer-text {
        color: #808080 !important;
      }
      .footer-link {
        color: #0073ff !important;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>
          Welcome to the <span style="color: #1976d2">Speck</span> Waitlist!
        </h1>
        <p>
          Hey {NAME}. Thank you for joining the waitlist for Speck, your AI
          Frontend Engineer. We're excited to have you on board!
        </p>
        <p>Please confirm your email address to secure your spot:</p>
        <a href="{CONFIRM_URL}" class="btn">Confirm Email</a>
      </div>
      <div class="image">
        <img
          src="https://speck.sh/logos/no-bg/speck-logo-256.png"
          alt="Speck"
        />
      </div>
    </div>
    <div class="footer">
      <p class="footer-text">
        Learn more about Speck at
        <a class="footer-link" href="https://speck.sh">speck.sh</a>
      </p>
      <p class="footer-text">
        <img
          src="https://speck.sh/logos/no-bg/speck-logo-1024.webp"
          alt="Speck Icon"
          class="speck-icon"
        />© 2024 <a href="https://speck.sh" class="footer-link">Speck</a>. All
        rights reserved.
      </p>
    </div>
  </body>
</html>
