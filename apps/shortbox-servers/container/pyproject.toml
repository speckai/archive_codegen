[project]
name = "sandbox-container"
version = "1.0.0"
description = "Sandbox container service for running lightweight ephemeral environments"
authors = [{ name = "Speck", email = "support@speck.sh" }]
dependencies = [
  "fastapi[standard]>=0.109.2",
  "uvicorn[standard]>=0.27.1",
  "python-socketio>=5.11.1",
  "loguru>=0.7.2",
  "pydantic>=2.6.1",
  "aiohttp>=3.9.3",
  "python-multipart>=0.0.9",
  "websockets>=14.2",
  "logtail-python>=0.3.3",
  "python-dotenv>=1.0.1",
]
requires-python = ">=3.12"
