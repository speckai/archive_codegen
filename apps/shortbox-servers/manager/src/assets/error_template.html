<!doctype html>
<html>
  <head>
    <title>Error</title>
    <style>
      @keyframes float {{
          0% {{ transform: translateY(0px); }}
          50% {{ transform: translateY(20px); }}
          100% {{ transform: translateY(0px); }}
      }}

      body {{
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
          font-family: Arial, sans-serif;
          background: radial-gradient(circle, rgb(5, 10, 50) 0%, rgb(5, 5, 5) 100%);
      }}
      img {{
          max-width: 200px;
          margin-bottom: 20px;
          animation: float 3s ease-in-out infinite;
      }}
      h1.error-text {{
          color: rgb(200, 200, 200);
          text-align: center;
          margin-bottom: 5px;
      }}
      p.error-text {{
          color: rgb(150, 150, 150);
          text-align: center;
          margin-top: 5px;
      }}
    </style>
  </head>
  <body>
    <img
      src="https://speck.sh/logos/no-bg/speck-logo-1024.webp"
      alt="Error Image"
    />
    <h1 class="error-text">Error</h1>
    <p class="error-text">{error_message}</p>
  </body>
</html>
